[package]
name = "migreedy"
version = "1.5.3"
edition = "2024"

[dependencies]
polars = { version = "0.55.2", features = ["lazy", "trigonometry", "performant"] } # rust pandas
clap = { version = "4.6.6", features = ["derive"] } # command line parser
rayon = "1.12.0" # parallel processing
indicatif = { version = "0.18.6", features = ["rayon"] } # progress bars
anyhow = "1.0.104" # error handling
reqwest = { version = "0.13.4", features = ["blocking", "json"] } # HTTP client for RIPE Atlas API
serde = { version = "1.0.229", features = ["derive"] } # JSON deserialization
serde_json = "1.0.151" # JSON parsing
flate2 = "1.1.9" # gzip decompression for embedded datasets
rstar = "0.13.0" # R-tree spatial indexing for efficient geographic queries

# use high performance allocator when running musl
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = { version = "0.1.52", default-features = false }

[profile.release]
strip = true      # strip binary
opt-level = 3     # optimize for speed
lto = true        # link time optimization
panic = "abort"   # reduce size
