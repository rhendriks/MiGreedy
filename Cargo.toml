[package]
name = "migreedy"
version = "1.7.0"
edition = "2024"
description = "A fast, parallel improved version of the iGreedy algorithm for large-scale anycast-aware geolocation"
repository = "https://github.com/rhendriks/MiGreedy"
license = "MPL-2.0"
authors = ["Remi Hendriks <remi.hendriks@utwente.nl>"]
keywords = ["anycast", "geolocation", "measurement", "igreedy", "networking"]
rust-version = "1.96"

[dependencies]
polars = { version = "0.55.2", features = ["lazy", "trigonometry", "performant"] } # rust pandas
clap = { version = "4.6.6", features = ["derive"] } # command line parser
rayon = "1.12.0" # parallel processing
indicatif = { version = "0.18.6", features = ["rayon"] } # progress bars
anyhow = "1.0.104" # error handling
reqwest = { version = "0.13.4", features = ["blocking", "json"] } # HTTP client for RIPE Atlas API
serde = { version = "1.0.229", features = ["derive"] } # JSON deserialization
serde_json = "1.0.151" # JSON parsing
flate2 = "1.1.9" # gzip decompression for embedded datasets and warts input
rstar = "0.13.0" # R-tree spatial indexing for efficient geographic queries
glob = "0.3.4" # glob patterns for --warts paths

# use high performance allocator when running musl
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = { version = "0.1.52", default-features = false }

[profile.release]
opt-level = 3         # maximize for performance
lto = "fat"           # link-time optimization across all crates
codegen-units = 1     # compiling optimization (better inlining/vectorization)
panic = "abort"       # remove stack unwinding code
strip = true          # reduce binary size
